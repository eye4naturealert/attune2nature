<!DOCTYPE html>

<html>

<head>
    <title>Attune2Nature</title>
</head>

<body>

    <h1>Attune2Nature</h1>

    <p>
        Choose a location, species, and alert interval.
    </p>


    <label for="aoi">Area</label>

    <select id="aoi">

        {% for aoi in options["aois"] %}

            <option value="{{ aoi['value'] }}">
                {{ aoi["label"] }}
            </option>

        {% endfor %}

    </select>


    <br><br>


    <label for="species">Species</label>

    <select id="species">

        {% for species in options["species"] %}

            <option value="{{ species['value'] }}">
                {{ species["label"] }}
            </option>

        {% endfor %}

    </select>


    <br><br>


    <label for="time_interval">Alert Interval</label>

    <select id="time_interval">

        {% for interval in options["time_intervals"] %}

            <option value="{{ interval['value'] }}">
                {{ interval["label"] }}
            </option>

        {% endfor %}

    </select>


    <br><br>


    <label for="email">Email Address</label>

    <input
        type="email"
        id="email"
        placeholder="you@example.com"
    >


    <br><br>


    <button>
        Create Alert
    </button>


</body>

</html>
